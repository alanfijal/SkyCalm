name: Project checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff format --check grid services scripts tests
      - run: python -m ruff check grid services scripts tests
      - run: python -m pytest -q
      - run: python scripts/package_lambda.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm test && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Check responsive layouts and themes in Chromium
        working-directory: web
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:layout
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate and plan with mocked providers
        run: |
          for directory in infra/bootstrap infra/environments/dev; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
            terraform -chdir="$directory" test
          done
      - run: bash -n scripts/check_aws.sh && bash -n scripts/run_grid.sh
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked source for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: secret
          exit-code: '1'
      - name: Check Terraform security settings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'
